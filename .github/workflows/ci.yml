name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint y pruebas (PHP 8.3 + MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crud_edificios
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: crud_edificios
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql

      - name: Lint de sintaxis PHP
        run: |
          find . -name "*.php" -not -path "./Infrastructure/Adapters/Email/PHPMailer/*" -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Migrar base de datos
        run: mysql -h 127.0.0.1 -uroot -proot crud_edificios < database/schema_tables.sql

      - name: Pruebas de dominio y aplicacion (repositorio en memoria)
        run: php tests/EdificioCrudlTest.php

      - name: Pruebas de integracion (adaptador MySQL)
        run: php tests/EdificioRepositoryIntegrationTest.php

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edificios-php:ci .

  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Disparar deploy hook de Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Secret RENDER_DEPLOY_HOOK_URL no configurado: se omite el despliegue."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"